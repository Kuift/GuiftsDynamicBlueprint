# Public-server AI director startup policy.
# Changes take effect when the rules scripts are reloaded or the server restarts.

config_version = 1

# off | suggest | auto
ctf_default_mode = auto

# Grants at most one free AI builder to an automatic CTF team per round when
# it has an active plan, a safe home-connected spawn, and no existing worker.
ctf_bootstrap_enabled = true
