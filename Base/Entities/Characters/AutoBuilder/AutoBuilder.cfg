# Collisionless director-test construction orb

$sprite_factory                                   = generic_sprite
@$sprite_scripts                                  = AIBuilderStatusBubble.as;
$sprite_texture                                   = MagicOrb.png
s32_sprite_frame_width                            = 8
s32_sprite_frame_height                           = 8
f32 sprite_offset_x                               = 0
f32 sprite_offset_y                               = 0

$sprite_gibs_start                                = *start*
$sprite_gibs_end                                  = *end*

$sprite_animation_start                           = *start*
	$sprite_animation_default_name                  = default
	u16 sprite_animation_default_time               = 4
	u8_sprite_animation_default_loop                = 1
	@u16 sprite_animation_default_frames            = 3; 2; 1; 0;
$sprite_animation_end                             = *end*

$shape_factory                                    = box2d_shape
@$shape_scripts                                   =
f32 shape_mass                                    = 1.0
f32 shape_radius                                  = 4.0
f32 shape_friction                                = 0.0
f32 shape_elasticity                              = 0.0
f32 shape_buoyancy                                = 0.0
f32 shape_drag                                    = 0.0
bool shape_collides                               = no
bool shape_ladder                                 = no
bool shape_platform                               = no
@f32 verticesXY                                   =
u8 block_support                                  = 0
bool block_background                             = no
bool block_lightpasses                            = no
bool block_snaptogrid                             = no

$movement_factory                                 =
$brain_factory                                    = generic_brain
@$scripts                                         = AIBuilderBrain.as;
$attachment_factory                               =
$inventory_factory                                =

$name                                             = autobuilder
@$scripts                                         = AutoBuilder.as;
f32 health                                        = 4.0

$inventory_name                                   = Autobuilder Orb
$inventory_icon                                   = MagicOrb.png
u8 inventory_icon_frame                           = 0
u8 inventory_icon_frame_width                     = 8
u8 inventory_icon_frame_height                    = 8
u8 inventory_used_width                           = 0
u8 inventory_used_height                          = 0
u8 inventory_max_stacks                           = 0
